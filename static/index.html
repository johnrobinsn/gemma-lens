<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gemma-Lens — multimodal search with EmbeddingGemma 2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-neutral-50 text-neutral-900 min-h-screen">

<header class="border-b border-neutral-200 bg-white">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-baseline gap-3">
      <h1 class="text-xl font-semibold tracking-tight">Gemma-Lens</h1>
      <span class="text-sm text-neutral-500">multimodal search · EmbeddingGemma 2</span>
    </div>
    <a href="https://huggingface.co/google/embeddinggemma-2"
       class="text-sm text-blue-600 hover:text-blue-800" target="_blank" rel="noreferrer">
      model card ↗
    </a>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <section id="search-section">
    <div class="flex items-stretch gap-2">
      <input id="query-input"
             type="text"
             autofocus
             placeholder="Search anything — text, voice, or image"
             class="flex-1 px-4 py-3 rounded-xl border border-neutral-300 bg-white
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      <button id="mic-btn" title="Record audio query"
              class="px-4 py-3 rounded-xl border border-neutral-300 bg-white hover:bg-neutral-100
                     flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button id="upload-btn" title="Upload image query"
              class="px-4 py-3 rounded-xl border border-neutral-300 bg-white hover:bg-neutral-100
                     flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <input id="file-input" type="file" accept="image/*" class="hidden" />
    </div>

    <div id="examples" class="mt-4 flex flex-wrap gap-2"></div>

    <div id="query-status" class="mt-3 text-sm text-neutral-500 min-h-[1.25rem]"></div>
  </section>

  <section id="results-section" class="mt-8 hidden">
    <div class="flex items-baseline justify-between">
      <h2 class="text-lg font-medium">Results</h2>
      <span id="timing" class="text-sm text-neutral-500"></span>
    </div>
    <div id="results-grid"
         class="mt-4 grid gap-3 grid-cols-2 sm:grid-cols-3 md:grid-cols-4">
    </div>
  </section>
</main>

<!-- Modal for tile detail -->
<div id="modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
  <div class="bg-white rounded-xl max-w-3xl w-full max-h-[90vh] overflow-auto">
    <div class="flex items-center justify-between px-4 py-3 border-b border-neutral-200">
      <h3 id="modal-title" class="font-medium truncate"></h3>
      <button id="modal-close" class="text-neutral-500 hover:text-neutral-900">✕</button>
    </div>
    <div id="modal-body" class="p-4"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
